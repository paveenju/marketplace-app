name: marketplace-app

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - marketplace_pgdata:/var/lib/postgresql/data
    ports:
      - 7412:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: Marketplace.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=marketplace;Username=postgres;Password=postgres"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 5187:8080 # lets you hit the API/Swagger directly at localhost:5187 for debugging

  web:
    build:
      context: ../frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - 8099:80

volumes:
  marketplace_pgdata:
